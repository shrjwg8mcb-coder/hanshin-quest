<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한신 동네탐험대</title>
<style>
:root{color-scheme:dark;--bg:#1a0d33;--p1:#2a1450;--p2:#4b2a8a;--p3:#7c4dff;--p4:#b794ff;--gold:#ffd54a;--ink:#f4ecff;--mute:#b9a6e0;--road:#5b3f9c;--blk:#3a2070;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding:10px 14px;background:linear-gradient(#3b1d72,#2a1450);border-bottom:3px solid var(--p3)}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0;letter-spacing:-.3px}
.coin{background:#0004;border:2px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.xp{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px}
.lv{background:var(--gold);color:#2a1450;font-weight:800;border-radius:6px;padding:1px 7px}
.bar{flex:1;height:12px;background:#0006;border-radius:8px;border:2px solid var(--p3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p3),var(--p4));transition:width .5s}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:14px}
.view.on{display:block}
#v-map{padding:0;overflow:auto;background:#150a2b}
#mapwrap{width:100%;min-width:600px}
svg text{font-family:inherit}
.shop{cursor:pointer}
.shop:active circle{transform:scale(.9)}
.nav{display:flex;background:var(--p1);border-top:3px solid var(--p3)}
.nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 8px;font-size:12px;font-family:inherit}
.nav button b{display:block;font-size:20px}
.nav button.on{color:var(--gold);background:#7c4dff33}
.card{background:linear-gradient(#3b2070,#2d1759);border:2px solid var(--p3);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #0005}
.card h2{margin:0 0 8px;font-size:16px}
.tag{display:inline-block;font-size:11px;background:#7c4dff55;border-radius:10px;padding:2px 8px;margin-right:4px;color:var(--p4)}
.ribbon{background:var(--gold);color:#2a1450;font-weight:800;font-size:12px;padding:3px 10px;border-radius:6px;display:inline-block;margin-bottom:8px}
select,input,textarea{width:100%;background:#150a2b;color:var(--ink);border:2px solid var(--p3);border-radius:10px;padding:10px;font:inherit;font-size:14px;margin:6px 0}
.btn{background:linear-gradient(var(--p4),var(--p3));color:#fff;border:0;border-bottom:4px solid #4b2a8a;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;font-size:15px;width:100%}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.gold{background:var(--gold);color:#2a1450;border-bottom-color:#b8921a}
.btn:disabled{opacity:.5}
.q{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #7c4dff55;font-size:14px}
.q:last-child{border:0}
.q .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--p4);display:grid;place-items:center;font-size:14px;flex:none}
.q.done .ck{background:var(--gold);border-color:var(--gold);color:#2a1450}
.q.done span{text-decoration:line-through;color:var(--mute)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#3b2070,#2a1450);border-top:3px solid var(--gold);border-radius:20px 20px 0 0;padding:16px;transform:translateY(110%);transition:transform .3s;z-index:5;max-height:70%;overflow:auto}
.sheet.on{transform:none}
.x{position:absolute;right:12px;top:10px;background:#0005;border:0;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:16px}
.photo{height:130px;border-radius:12px;background:repeating-linear-gradient(45deg,#2a1450,#2a1450 10px,#34195f 10px,#34195f 20px);border:2px dashed var(--p3);display:grid;place-items:center;color:var(--mute);font-size:13px;margin-bottom:10px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.km{float:right;background:var(--gold);color:#2a1450;font-weight:800;font-size:12px;border-radius:10px;padding:2px 9px}
.muted{color:var(--mute);font-size:13px;line-height:1.5}
#clear{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20}
#clear.on{display:grid}
.clearbox{text-align:center;background:linear-gradient(#5b2fb0,#2a1450);border:4px solid var(--gold);border-radius:22px;padding:28px 36px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.clearbox h3{font-size:32px;margin:6px 0;color:var(--gold);text-shadow:0 3px 0 #4b2a8a}
.stars{font-size:38px;letter-spacing:4px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-4px)}}
.pin{animation:bob 2s ease-in-out infinite}
/* ===== 픽셀(메이플/동숲) 스타일 ===== */
body,button,select,input,textarea{font-family:'DotGothic16','Galmuri11',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
svg{image-rendering:pixelated;shape-rendering:crispEdges}
svg text{shape-rendering:auto}
header{background:#5b2fb0;border-bottom:4px solid #2a1450;box-shadow:0 4px 0 #b794ff}
h1{font-size:19px;text-shadow:2px 2px 0 #2a1450}
.coin{border-radius:0;background:#2a1450;border:3px solid var(--gold)}
.lv{border-radius:0;border:2px solid #2a1450}
.bar{border-radius:0;border:3px solid #2a1450;background:#2a1450;height:16px}
.bar i{border-radius:0;background:repeating-linear-gradient(90deg,#ffd54a 0 6px,#ffb300 6px 8px)}
.card,.sheet{background:#fbf3ff;color:#3b1d72;border:4px solid #4b2a8a;border-radius:0;box-shadow:4px 4px 0 #1a0d33,inset 0 0 0 3px #d9c2ff}
.sheet{border-bottom:0;box-shadow:0 -4px 0 #1a0d33,inset 0 0 0 3px #d9c2ff}
.card h2{color:#4b2a8a}
.muted{color:#6b5a8e}
.card b,.sheet b,.q b{color:#7c4dff}
.tag{background:#e6d8ff;color:#4b2a8a;border-radius:0;border:2px solid #b794ff}
.ribbon{border-radius:0;border:3px solid #2a1450;box-shadow:3px 3px 0 #2a1450}
select,input,textarea{background:#fff;color:#3b1d72;border:3px solid #4b2a8a;border-radius:0}
.btn{border-radius:0;border:3px solid #2a1450;box-shadow:0 4px 0 #2a1450;background:#9b6bff}
.btn.gold{background:var(--gold);color:#2a1450}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1450}
.q{border-bottom:2px dotted #b794ff}
.q .ck{border-radius:0;border:3px solid #7c4dff}
.q.done .ck{border-color:#2a1450}
.q.done span{color:#9a8bb8}
.x{border-radius:0;background:#4b2a8a;border:2px solid #2a1450}
.photo{border-radius:0;background:repeating-conic-gradient(#efe2ff 0 25%,#e0cdfa 0 50%) 0 0/16px 16px;border:3px dashed #7c4dff;color:#7c4dff}
.km{border-radius:0;border:2px solid #2a1450}
.nav{background:#2a1450;border-top:4px solid #b794ff}
.nav button.on{background:#5b2fb0}
.clearbox{border-radius:0;border:5px solid var(--gold);box-shadow:6px 6px 0 #000}
#v-map{background:#8fd16a}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
</head>
<body><div id="app">
<header>
 <div class="top"><h1>🧭 한신 동네탐험대</h1><div class="coin">🪙 <span id="pt">0</span></div></div>
 <div class="xp"><span class="lv">Lv.<span id="lv">1</span></span><div class="bar"><i id="xb"></i></div><span id="xt">0/100</span></div>
</header>
<main>
 <section class="view on" id="v-map"><div id="mapwrap"></div>
  <div class="sheet" id="sheet"></div></section>
 <section class="view" id="v-quest"></section>
 <section class="view" id="v-near"></section>
</main>
<nav class="nav">
 <button class="on" data-t="map"><b>🗺️</b>지도</button>
 <button data-t="quest"><b>📜</b>퀘스트</button>
 <button data-t="near"><b>🌳</b>주변 갈 곳</button>
</nav>
</div>
<div id="clear"><div class="clearbox"><div class="stars">⭐⭐⭐</div><h3>QUEST CLEAR!</h3><div id="cmsg" style="margin-bottom:14px"></div><button class="btn gold" onclick="document.getElementById('clear').classList.remove('on')">확인</button></div></div>

<script>
// ===== 데이터: 여기만 수정하면 됩니다 =====
// cat: food 음식 / cafe 카페 / pub 주점 / store 편의점·마트
// desc, menu, hours, price 를 채우세요. (원조춘천닭갈비만 예시로 채워져 있음)
const SHOPS=[
 {id:1,n:"장금이네순대국",cat:"food",x:158,y:260},
 {id:2,n:"향마라탕",cat:"food",x:275,y:300},
 {id:3,n:"나누리",cat:"pub",x:155,y:344},
 {id:4,n:"봉구스밥버거",cat:"food",x:160,y:388},
 {id:5,n:"원조춘천닭갈비",cat:"food",x:314,y:515,
  desc:"(예시) 학교 앞에서 친구들과 모이기 좋은 닭갈비집. 학생 인터뷰 내용을 여기에 적어 주세요.",menu:"닭갈비 · 볶음밥",hours:"11:00~22:00",price:"1인 12,000원~"},
 {id:6,n:"맘스터치",cat:"food",x:142,y:510},
 {id:7,n:"한대포차",cat:"pub",x:142,y:584},
 {id:8,n:"이삭토스트",cat:"food",x:158,y:617},
 {id:9,n:"CU",cat:"store",x:323,y:568},
 {id:10,n:"GS25",cat:"store",x:286,y:240},
 {id:11,n:"미소김밥",cat:"food",x:273,y:648},
 {id:12,n:"루트",cat:"cafe",x:102,y:684},
 {id:13,n:"스테이커피",cat:"cafe",x:160,y:799},
 {id:14,n:"복고다방",cat:"cafe",x:423,y:782},
 {id:15,n:"찌개동아리",cat:"food",x:343,y:840},
 {id:16,n:"우리마트",cat:"store",x:150,y:856},
 {id:17,n:"정감포차",cat:"pub",x:143,y:920},
 {id:18,n:"해우리",cat:"food",x:249,y:976}
];
const CAT={food:["🍚","#ff9a5a","음식점"],cafe:["☕","#ff7ab8","카페"],pub:["🍺","#ffc94a","주점"],store:["🛒","#5ad1ff","편의점·마트"]};
// 오산시 주변 갈 곳: 첫 칸만 예시, 나머지는 빈칸 (km는 직접 확인 후 수정)
const NEAR=[
 {n:"물향기수목원",km:"약 3.5",tag:"산책·사진",img:"",desc:"(예시) 수업 끝나고 가볍게 걷기 좋은 곳. 실제 거리·설명·사진을 확인해 수정해 주세요."},
 {n:"",km:"",tag:"",img:"",desc:""},{n:"",km:"",tag:"",img:"",desc:""},
 {n:"",km:"",tag:"",img:"",desc:""},{n:"",km:"",tag:"",img:"",desc:""}
];
// ======================================
let S={visited:[],fav:null,favText:"",xp:0,pts:0,nearOpen:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("hs-quest")||"{}"))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("hs-quest",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ----- 지도 (스크린샷을 게임 그래픽으로 재구성) -----
const BLK=[[110,205,70,100],[55,300,60,100],[105,360,70,90],[65,490,70,60],[60,540,80,120],[55,640,90,100],[75,760,70,80],[85,860,60,130],
[270,230,50,60],[275,305,70,60],[300,360,60,70],[380,260,60,80],[470,320,60,90],[285,500,90,60],[390,520,70,60],[450,540,80,70],
[260,630,100,100],[385,630,70,70],[490,690,80,60],[300,830,100,100],[410,850,70,90],[480,840,60,90],[260,930,60,80]];
function drawMap(){
 const R=(x,y,w,h,f,s)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${s?` stroke="${s}" stroke-width="3"`:""}/>`;
 let g=`<svg viewBox="0 0 600 1080" width="100%" xmlns="http://www.w3.org/2000/svg">
 <defs><pattern id="ck" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#93d96d"/><rect width="24" height="24" fill="#88cf62"/><rect x="24" y="24" width="24" height="24" fill="#88cf62"/></pattern></defs>
 ${R(0,0,600,1080,"url(#ck)")}`;
 // 꽃·풀
 let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 for(let i=0;i<70;i++){const x=Math.floor(rnd()*58)*10+5,y=Math.floor(rnd()*106)*10+5,c=["#fff","#ff9fcf","#ffe35a"][i%3];g+=R(x,y,6,6,c)+R(x+2,y+2,2,2,"#e8a000")}
 // 연못
 g+=`<polygon points="415,945 600,1000 600,1080 300,1080" fill="#5ac8f5" stroke="#2d8fc9" stroke-width="5"/>`+R(450,1010,50,6,"#b9ecff")+R(380,1045,70,6,"#b9ecff")+R(520,1050,40,6,"#b9ecff");
 // 흙길
 [[185,-5,80,1090],[-5,470,610,30],[-5,795,610,22],[-5,185,610,20]].forEach(a=>{g+=R(a[0],a[1],a[2],a[3],"#ecd29c","#c49a5a")});
 for(let y=10;y<1080;y+=36)g+=R(222,y,6,16,"#f7e6bd");
 g+=`<text x="213" y="135" fill="#8a6532" font-size="13" transform="rotate(90 213 135)">한신대길</text>`;
 // 집
 const RF=["#9b6bff","#ff8fb8","#6fd9c8","#ffb86b","#b794ff","#7aa8ff"];
 BLK.forEach((b,i)=>{const [x,y,w,h]=b,rh=Math.round(h*.42),c=RF[i%6];
  g+=R(x+5,y+5,w,h,"#0002")+R(x,y,w,h,"#fff1cf","#6b4a2b")+R(x,y,w,rh,c,"#4b2a8a")+R(x+4,y+rh-8,w-8,4,"#0002");
  for(let k=x+10;k<x+w-6;k+=12)g+=R(k,y+4,4,rh-12,"#fff4");
  g+=R(x+w*.18,y+rh+10,12,12,"#9fe0ff","#6b4a2b")+R(x+w*.62,y+h-22,12,18,"#a8693a","#6b4a2b")});
 // 나무
 [[30,430],[560,430],[565,600],[28,740],[455,990],[110,1040],[520,160],[30,160],[330,170],[560,780]].forEach(t=>{
  g+=R(t[0]-4,t[1]+14,8,14,"#8a5a2b")+R(t[0]-16,t[1]-14,32,10,"#3fa34d","#2a7a38")+R(t[0]-22,t[1]-4,44,18,"#4cbb5c","#2a7a38")+R(t[0]-10,t[1]-8,8,6,"#8be28f")});
 // 캠퍼스 표지판
 g+=R(10,18,160,54,"#a8693a","#4a2d14")+R(16,24,148,42,"#ffd54a","#b8921a")+`<text x="90" y="43" text-anchor="middle" font-size="15" fill="#2a1450">🏫 한신대학교</text><text x="90" y="60" text-anchor="middle" font-size="12" fill="#2a1450">경기캠퍼스 START</text>`;
 // 캐릭터
 g+=`<g class="pin">${R(196,80,18,16,"#ffdcb8","#4a2d14")}${R(194,74,22,9,"#7c4dff","#2a1450")}${R(198,96,14,14,"#ff8fb8","#4a2d14")}${R(200,86,3,3,"#2a1450")}${R(207,86,3,3,"#2a1450")}</g>`;
 // 가게 (나무 간판 NPC 느낌)
 SHOPS.forEach(s=>{const c=CAT[s.cat],v=S.visited.includes(s.id),w=s.n.length*12+16;
  g+=`<g class="shop" onclick="openShop(${s.id})"><g class="pin">
  ${R(s.x-4,s.y+14,8,8,"#8a5a2b")}${R(s.x-18,s.y-18,36,32,c[1],v?"#ffd54a":"#2a1450")}${R(s.x-14,s.y-14,28,24,"#fff8")}
  <text x="${s.x}" y="${s.y+4}" text-anchor="middle" font-size="18">${c[0]}</text>
  ${v?`<text x="${s.x+10}" y="${s.y-16}" font-size="16">⭐</text>`:""}</g>
  ${R(s.x-w/2,s.y+24,w,20,"#fff6dd","#4a2d14")}<text x="${s.x}" y="${s.y+39}" text-anchor="middle" font-size="12" fill="#4a2d14">${esc(s.n)}</text></g>`});
 $("mapwrap").innerHTML=g+"</svg>";
}
function drawMapOld(){
 let g=`<svg viewBox="0 0 600 1080" width="100%" xmlns="http://www.w3.org/2000/svg">
 <defs><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff10"/></pattern>
 <linearGradient id="wt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8cff"/><stop offset="1" stop-color="#3b4fd0"/></linearGradient></defs>
 <rect width="600" height="1080" fill="#22104a"/><rect width="600" height="1080" fill="url(#gr)"/>
 <polygon points="415,945 600,1000 600,1080 300,1080" fill="url(#wt)" opacity=".85"/>
 <g fill="var(--road)" stroke="#8b6cd6" stroke-width="2">
  <rect x="185" y="-5" width="80" height="1090"/><rect x="-5" y="470" width="610" height="30"/>
  <rect x="-5" y="795" width="610" height="22"/><rect x="-5" y="185" width="610" height="20"/></g>
 <g stroke="#b794ff55" stroke-width="2" stroke-dasharray="10 10"><line x1="225" y1="0" x2="225" y2="1080"/></g>
 <text x="213" y="130" fill="#d7c4ff" font-size="12" transform="rotate(90 213 130)">한신대길</text>
 <g fill="var(--blk)" stroke="#6a45c0" stroke-width="2">${BLK.map(b=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="8"/>`).join("")}</g>
 <g><rect x="10" y="20" width="150" height="50" rx="12" fill="#ffd54a" stroke="#b8921a" stroke-width="3"/>
 <text x="85" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#2a1450">🏫 한신대학교</text><text x="85" y="60" text-anchor="middle" font-size="12" fill="#2a1450">경기캠퍼스 (START)</text></g>`;
 SHOPS.forEach(s=>{const c=CAT[s.cat],v=S.visited.includes(s.id);
  g+=`<g class="shop" onclick="openShop(${s.id})"><g class="pin">
  <circle cx="${s.x}" cy="${s.y}" r="17" fill="${c[1]}" stroke="${v?'#ffd54a':'#fff'}" stroke-width="${v?4:2.5}"/>
  <text x="${s.x}" y="${s.y+6}" text-anchor="middle" font-size="17">${c[0]}</text>
  ${v?`<text x="${s.x+14}" y="${s.y-10}" font-size="15">✅</text>`:""}</g>
  <text x="${s.x}" y="${s.y+33}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" stroke="#1a0d33" stroke-width="3" paint-order="stroke">${esc(s.n)}</text></g>`});
 $("mapwrap").innerHTML=g+"</svg>";
}

// ----- 가게 상세 -----
function openShop(id){
 const s=SHOPS.find(x=>x.id==id),c=CAT[s.cat],v=S.visited.includes(id);
 const row=(k,t)=>`<div class="muted"><b style="color:var(--p4)">${k}</b> ${t?esc(t):"<i>(입력 예정)</i>"}</div>`;
 $("sheet").innerHTML=`<button class="x" onclick="closeSheet()">✕</button>
 <div class="photo">${s.img?`<img src="${s.img}">`:"📷 가게 사진"}</div>
 <h2 style="margin:0 0 6px;font-size:20px">${esc(s.n)}</h2>
 <span class="tag">${c[0]} ${c[2]}</span>${S.fav==id?'<span class="tag" style="background:#ffd54a;color:#2a1450">💜 내 최애</span>':""}
 <p class="muted" style="margin:10px 0">${s.desc?esc(s.desc):"<i>가게 소개를 입력해 주세요. (인터뷰 내용, 운영 이야기 등)</i>"}</p>
 ${row("대표 메뉴",s.menu)}${row("영업시간",s.hours)}${row("가격대",s.price)}
 <button class="btn ${v?'':'gold'}" style="margin-top:12px" ${v?"disabled":""} onclick="visit(${id})">${v?"✅ 방문 인증 완료":"📍 방문 인증하기 (+30 XP)"}</button>`;
 $("sheet").classList.add("on");
}
const closeSheet=()=>$("sheet").classList.remove("on");
function visit(id){
 if(S.visited.includes(id))return;
 S.visited.push(id);gain(30,10);
 const first3=S.visited.length==3;
 save();drawMap();openShop(id);renderQuest();
 if(first3)clearPop("‘처음 가는 가게 3곳 방문하기’ 완료!\n보너스 +100 XP",100,30);
}

// ----- 레벨 -----
function gain(xp,pt){S.xp+=xp;S.pts+=pt;updHUD();save()}
function updHUD(){$("pt").textContent=S.pts;$("lv").textContent=Math.floor(S.xp/100)+1;
 $("xb").style.width=(S.xp%100)+"%";$("xt").textContent=(S.xp%100)+"/100"}
function clearPop(msg,xp,pt){gain(xp,pt);$("cmsg").innerHTML=esc(msg).replace(/\n/g,"<br>");$("clear").classList.add("on")}

// ----- 퀘스트 -----
function renderQuest(){
 const hasCafe=S.visited.some(i=>SHOPS.find(s=>s.id==i).cat=="cafe");
 const qs=[["처음 가는 가게 3곳 방문하기",S.visited.length>=3,`${Math.min(S.visited.length,3)}/3`],
  ["카페 1곳 방문 인증하기",hasCafe,hasCafe?"1/1":"0/1"],
  ["‘주변 갈 곳’ 둘러보기",S.nearOpen,S.nearOpen?"1/1":"0/1"],
  ["오늘의 퀘스트에 답하기",!!S.fav,S.fav?"1/1":"0/1"]];
 const opts=SHOPS.map(s=>`<option value="${s.id}" ${S.fav==s.id?"selected":""}>${CAT[s.cat][0]} ${esc(s.n)}</option>`).join("");
 $("v-quest").innerHTML=`<div class="card"><span class="ribbon">📅 오늘의 퀘스트</span>
  <h2>“내가 제일 아끼는 가게는…”</h2>
  <div class="muted">가게를 고르고 이유를 한 줄로 남겨 보세요! (+50 XP)</div>
  <select id="favSel"><option value="">가게 선택하기</option>${opts}</select>
  <textarea id="favTx" rows="3" placeholder="예) 사장님이 늘 덤을 챙겨주세요 😊">${esc(S.favText)}</textarea>
  <button class="btn gold" onclick="submitFav()">${S.fav?"답변 수정하기":"퀘스트 제출하기"}</button></div>
  <div class="card"><h2>🎯 탐험 퀘스트 목록</h2>${qs.map(q=>`<div class="q ${q[1]?"done":""}"><div class="ck">${q[1]?"✓":""}</div><span style="flex:1">${q[0]}</span><b style="color:var(--p4)">${q[2]}</b></div>`).join("")}</div>
  <div class="card"><h2>🏅 배지</h2><div style="font-size:30px;letter-spacing:6px">${S.visited.length>=1?"🥾":"🔒"}${S.visited.length>=3?"🧭":"🔒"}${S.visited.length>=9?"👑":"🔒"}${S.fav?"💜":"🔒"}</div>
  <div class="muted" style="margin-top:6px">1곳 · 3곳 · 9곳 방문 / 최애 가게 등록</div></div>`;
}
function submitFav(){
 const v=$("favSel").value,t=$("favTx").value.trim();
 if(!v){alert("가게를 먼저 골라 주세요!");return}
 const first=!S.fav;S.fav=+v;S.favText=t;save();drawMap();renderQuest();
 if(first)clearPop("오늘의 퀘스트 완료!\n최애 가게가 등록됐어요 💜",50,20);
}

// ----- 주변 갈 곳 -----
function renderNear(){
 $("v-near").innerHTML=`<div class="card"><span class="ribbon">📍 오산시 탐험 스팟</span><div class="muted">수업 끝나고 가볼 만한 숨은 장소를 모아 보세요. 첫 칸은 예시입니다.</div></div>`+
 NEAR.map(p=>`<div class="card"><div class="photo">${p.img?`<img src="${p.img}">`:"📷 사진"}</div>
 <span class="km">${p.km?p.km+" km":"__ km"}</span><h2>${p.n?esc(p.n):"장소 이름"}</h2>
 ${p.tag?`<span class="tag">${esc(p.tag)}</span>`:'<span class="tag">분류</span>'}
 <p class="muted" style="margin:8px 0 0">${p.desc?esc(p.desc):"<i>설명을 입력해 주세요.</i>"}</p></div>`).join("");
}

// ----- 탭 -----
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x==b));
 ["map","quest","near"].forEach(t=>$("v-"+t).classList.toggle("on",t==b.dataset.t));
 if(b.dataset.t=="near"&&!S.nearOpen){S.nearOpen=true;save();clearPop("‘주변 갈 곳 둘러보기’ 완료!\n+20 XP",20,5)}
 if(b.dataset.t=="quest")renderQuest();
 if(b.dataset.t!="map")closeSheet();
});
drawMap();renderQuest();renderNear();updHUD();
</script></body></html>
